workflows:
  flutter-apk-build:
    name: Build Flutter APK
    instance_type: mac_mini
    environment:
      flutter: 3.44.7

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
